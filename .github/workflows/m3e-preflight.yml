name: M3E Phase A debug baseline

on:
  push:
    branches:
      - m3e/integration
      - m3e/final-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-debug-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run SDK-free static contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_phase_a_contracts.py
          if [[ -f scripts/check_secondary_ui_contracts.py ]]; then
            python3 scripts/check_secondary_ui_contracts.py
          fi
          if [[ -f scripts/check_m3e_integration_contracts.py ]]; then
            python3 scripts/check_m3e_integration_contracts.py
          fi
          if [[ -f scripts/check_phase_f_contracts.py ]]; then
            python3 scripts/check_phase_f_contracts.py
          fi
          if [[ -f app/src/main/java/me/zhanghai/android/files/settings/ExpressiveSettingsScreen.kt ]]; then
            test ! -e app/src/main/res/xml/settings.xml
            test ! -e app/src/main/res/xml/ftp_server.xml
            ! grep -q 'Settings.MATERIAL_DESIGN_3.valueCompat' app/src/main/java/me/zhanghai/android/files/theme/custom/CustomThemeHelper.kt
          fi

      - name: Install baseline Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          if [[ -z "$SDK_ROOT" ]]; then SDK_ROOT="$ANDROID_SDK_ROOT"; fi
          if [[ -z "$SDK_ROOT" ]]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.1.13356709" "cmake;3.22.1"
          # API 37's SDK Manager package is "android-37.0" on GitHub runners.
          # Some AGP/aapt2 paths still look up "android-37"; provide a local alias.
          if [[ ! -e "$SDK_ROOT/platforms/android-37" && -d "$SDK_ROOT/platforms/android-37.0" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Assemble standard debug and run JVM test task
        run: ./gradlew --no-daemon --warning-mode all :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest

      - name: Collect Android lint diagnostics (advisory until legacy View debt is triaged)
        id: legacy_lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Publish explicit lint outcome
        if: always()
        shell: bash
        run: |
          echo "Android lint command outcome: **${{ steps.legacy_lint.outcome }}** (non-blocking; see report)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android lint audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3e-phase-f-lint-report
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble opt-in systemPicker debug and run JVM test task
        run: ./gradlew --no-daemon --warning-mode all -PsystemPicker :app:assembleSystemPickerDebug :app:testSystemPickerDebugUnitTest
