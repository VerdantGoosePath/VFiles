name: M3E Settings branch verification

on:
  push:
    branches:
      - m3e/settings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out settings branch
        uses: actions/checkout@v4
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify retained Phase A contracts and settings routes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_phase_a_contracts.py
          test -f app/src/main/java/me/zhanghai/android/files/settings/ExpressiveSettingsScreen.kt
          test ! -e app/src/main/java/me/zhanghai/android/files/settings/SettingsPreferenceFragment.kt
          test ! -e app/src/main/res/xml/settings.xml
          ! grep -q 'Settings.MATERIAL_DESIGN_3.valueCompat' app/src/main/java/me/zhanghai/android/files/theme/custom/CustomThemeHelper.kt
          grep -q 'MaterialExpressiveTheme' app/src/main/java/me/zhanghai/android/files/compose/theme/VFilesTheme.kt
      - name: Install Android 37, build tools, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          if [[ -z "$SDK_ROOT" ]]; then SDK_ROOT="$ANDROID_SDK_ROOT"; fi
          if [[ -z "$SDK_ROOT" ]]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.1.13356709" "cmake;3.22.1"
          if [[ ! -e "$SDK_ROOT/platforms/android-37" && -d "$SDK_ROOT/platforms/android-37.0" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
      - name: Compile app, instrumentation tests and run JVM tests
        run: ./gradlew --no-daemon --warning-mode all :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
