name: Build Files Fork APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;37.0.0" "ndk;28.1.13356709" "cmake;3.22.1"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FILES_FORK_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.FILES_FORK_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.FILES_FORK_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.FILES_FORK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$SIGN_STORE_PASSWORD" && -n "$SIGN_KEY_ALIAS" && -n "$SIGN_KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/files-fork.jks"
            echo "STORE_FILE=$RUNNER_TEMP/files-fork.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SIGN_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGN_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGN_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository signing secrets"
          else
            # Fallback installable APK: this signing key is NEW on each run.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/files-fork-ephemeral.jks" \
              -storepass android -keypass android -alias filesfork \
              -keyalg RSA -keysize 2048 -validity 3650 -noprompt \
              -dname "CN=Files Fork CI"
            echo "STORE_FILE=$RUNNER_TEMP/files-fork-ephemeral.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=filesfork" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "::warning::Ephemeral signing key. Configure signing secrets for updatable releases."
          fi

      - name: Build installable release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Fork-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "Files Fork $GITHUB_REF_NAME" --generate-notes
