[package]
name = "vfiles_archive"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust archive backends for VFiles"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rawzip = "0.5.2"
ripzip = "0.1.0"
flate2 = "1"
sevenz-turbo = { version = "0.23.2", default-features = false, features = ["compress", "aes256", "native-crypto", "util", "deflate", "bzip2", "zstd", "lz4", "ppmd"] }
unrar-rs = { version = "0.10", default-features = false, features = ["crypto-rust"] }
tar = "0.4"
lzma-rust2 = { version = "0.22", features = ["xz", "encoder"] }
tempfile = "3"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
